[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mirage-trap"
version = "0.1.0"
description = "High-interaction deception honeypot (HTTP, SSH, Telnet) with deterministic emulators and LLM long-tail responses."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "mirage-trap contributors" }]
keywords = ["honeypot", "deception", "threat-intelligence", "security", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "h11>=0.14",
    "httpx>=0.27",
    "typer>=0.12",
    "jinja2>=3.1",
    "asyncssh>=2.14",
    "pydantic>=2.6",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/deivycom21-cell/mirage-trap"
Repository = "https://github.com/deivycom21-cell/mirage-trap"
Issues = "https://github.com/deivycom21-cell/mirage-trap/issues"

[project.optional-dependencies]
geoip = ["maxminddb>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "maxminddb>=2.5"]

[project.scripts]
mirage-trap = "mirage_trap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mirage_trap"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "mirage_trap/config.example.toml"

[tool.hatch.build.targets.sdist]
include = ["mirage_trap", "tests", "deploy", "config.example.toml", "README.md", "LICENSE", "PLAN.md", "Dockerfile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
