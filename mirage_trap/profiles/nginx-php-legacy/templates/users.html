{% extends "admin.html" %}
{% block content %}
<h2>Users</h2>
<table>
<tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Active</th></tr>
{% for u in users %}<tr><td>{{ u[0] }}</td><td>{{ u[1] }}</td><td>{{ u[2] }}</td><td>{{ u[3] }}</td><td>{{ "yes" if u[4] else "no" }}</td></tr>
{% endfor %}
</table>
{% endblock %}
