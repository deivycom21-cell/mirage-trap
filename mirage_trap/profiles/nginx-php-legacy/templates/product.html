{% extends "_layout.html" %}
{% block content %}
{% if p %}
<h2>{{ p[1] }}</h2>
<p><b>Price:</b> ${{ p[2] }}</p>
<p>{{ p[3] }}</p>
<p><a href="index.php">&laquo; Back to products</a></p>
{% else %}
<h2>Product not found</h2>
<p><a href="index.php">&laquo; Back to products</a></p>
{% endif %}
{% endblock %}
