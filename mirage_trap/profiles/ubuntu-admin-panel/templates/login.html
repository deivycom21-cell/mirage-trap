{% extends "_layout.html" %}
{% block title %}Ops Console - Sign in{% endblock %}
{% block content %}
<h2>Sign in</h2>
{% if error %}<p class="err">Invalid credentials.</p>{% endif %}
<form method="post" action="login.php">
<p>Username<br><input name="username" autofocus></p>
<p>Password<br><input type="password" name="password"></p>
<p><button>Sign in</button></p>
</form>
<p style="color:#90a4ae;font-size:11px">Authorized personnel only. Activity is logged.</p>
{% endblock %}
