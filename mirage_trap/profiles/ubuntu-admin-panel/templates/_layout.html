<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Ops Console - {{ world.host.hostname }}{% endblock %}</title>
<style>
body{margin:0;font-family:"DejaVu Sans",Verdana,sans-serif;font-size:13px;background:#eceff1;color:#263238}
.bar{background:#37474f;color:#eceff1;padding:10px 18px}.bar a{color:#b0bec5;margin-left:14px;text-decoration:none}
.box{max-width:900px;margin:22px auto;background:#fff;padding:20px;border-radius:3px;box-shadow:0 1px 2px #b0bec5}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid #eceff1;text-align:left}
pre{background:#263238;color:#cfd8dc;padding:10px;max-height:520px;overflow:auto;font-size:12px}
.err{color:#c62828}input,select,button{padding:5px}
</style>
</head>
<body>
<div class="bar"><b>{{ company.name }} &middot; Ops</b>{% block nav %}{% endblock %}</div>
<div class="box">{% block content %}{% endblock %}</div>
</body>
</html>
