# mirage-trap behind a real nginx ("behind-nginx" mode, recommended for production).
#
# Why: Python cannot fake the TCP/IP stack or the TLS ServerHello (JA3S) of nginx.
# Here they ARE nginx's, because a real nginx terminates the connection. mirage-trap
# only produces the HTTP content.
#
# Matching mirage-trap config.toml:
#   [server]
#   profile = "nginx-php-legacy"   # the profile whose stack this front matches
#   host = "127.0.0.1"
#   port = 8080
#   behind_proxy = true
#   trusted_proxies = ["127.0.0.1"]
#   client_ip_header = "X-Real-IP"
#   ja3_header = "X-Mirage-JA3"
#   ja4_header = "X-Mirage-JA4"
#
# JA3: stock nginx does not expose the ClientHello. Build nginx with
# https://github.com/fooinha/nginx-ssl-ja3 (variable $http_ssl_ja3_hash), or use
# OpenResty/Angie with an equivalent module. Without it, drop the JA3/JA4 lines:
# everything else works.
#
# The internal headers are always *set* here (never passed through), so a client
# cannot forge them, and mirage-trap strips them before any other logic runs.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens on;                 # Ubuntu default: "nginx/1.18.0 (Ubuntu)"
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream mirage {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default "";
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # A plausible, non-self-signed certificate for the decoy domain (e.g. Let's Encrypt).
        ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 1m;          # matches the trap's own body limit

        location / {
            proxy_pass http://mirage;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # internal headers: always overwritten, never trusted from the client
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Mirage-JA3 $http_ssl_ja3_hash;   # nginx-ssl-ja3 module
            proxy_set_header X-Mirage-JA4 "";
            proxy_set_header X-Forwarded-For "";

            # use the trap's Server/Date/X-Powered-By so headers stay coherent with the profile
            proxy_pass_header Server;
            proxy_pass_header Date;

            # stream slow (LLM-backed) answers like PHP's flush() would
            proxy_buffering off;
            proxy_read_timeout 60s;

            # never let nginx rewrite the trap's own error pages
            proxy_intercept_errors off;
        }
    }
}
